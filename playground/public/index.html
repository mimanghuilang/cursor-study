<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursor Study · Todo Playground</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <p class="brand">cursor-study</p>
        <h1>Todo Playground</h1>
        <p class="lede">Minimal app for practicing Cursor Tab, Debug, Browser, and more.</p>
      </header>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <label class="sr-only" for="todo-input">New todo</label>
        <input
          id="todo-input"
          name="title"
          type="text"
          placeholder="Add a todo…"
          required
        />
        <button type="submit">Add</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <ul id="todo-list" class="todo-list"></ul>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
